server:
  port: ${MENU_SERVICE_PORT:8083}

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MENU_DB_NAME:menu_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-before-deploy-32chars}

restaurant-service:
  base-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: menu-service
    description: Restaurant menu categories, food items, and availability
    version: 0.0.1-SNAPSHOT
