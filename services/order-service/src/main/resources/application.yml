server:
  port: ${ORDER_SERVICE_PORT:8084}
spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_DB_NAME:order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
security:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-before-deploy-32chars}
service-clients:
  menu-url: ${MENU_SERVICE_URL:http://localhost:8083}
  restaurant-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: order-service
    description: Carts, checkout, and order lifecycle
    version: 0.0.1-SNAPSHOT
