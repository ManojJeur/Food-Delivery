server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - SecureHeaders
      routes:
        - id: auth-user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurants/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: menu-service
          uri: lb://menu-service
          predicates:
            - Path=/api/v1/menu/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/deliveries/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    # Local development fallback only. Set JWT_SECRET to the same secret used
    # by the User Service; use a managed secret in deployed environments.
    secret: ${JWT_SECRET:local-dev-secret-change-before-deploy-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

